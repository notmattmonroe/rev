<!DOCTYPE html>
<html lang="en">
<head>
  <link href='https://fonts.googleapis.com/css?family=Josefin+Sans&subset=latin,latin-ext' rel='stylesheet' type='text/css'>
  <link href='https://fonts.googleapis.com/css?family=Forum' rel='stylesheet' type='text/css'>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="">
  <meta name="author" content="Matt Yarbrough">
  <title>{% block title %}revmatt{% endblock %}</title>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/reset.css">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/text.css">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/960.css">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/rev2015.css">
</head>
<body>
<h1>
<div class="header">
  Rev Matt
  <span class="navigation">
    <a href="{{ SITEURL }}/blog/">blog</a>
    <a href="{{ SITEURL }}/reviews/">reviews</a>
    <a href="{{ SITEURL }}/projects/">projects</a>
    <a href="{{ SITEURL }}/about/">about</a>
  </span>
</div>
</h1>

<div class="container_12">
  <div class="grid_12">
    <p>
      {% block content %}{% endblock %}
    </p>
  </div>

  <div class="grid_6">
    {% block sidebar %}
    <span class="quote" id="quote-widget">
      <em>Loading quote…</em>
    </span>
    <div class="archives">
      {% block archives %}{% endblock %}
    </div>
    {% endblock %}
  </div>
</div>

<div class="footer">
  &copy;2015 revmatt.com all rights reserved.
</div>

<script>
fetch('{{ SITEURL }}/extras/quotes.json')
  .then(function(r){ return r.json(); })
  .then(function(q){
    var pick = q[Math.floor(Math.random() * q.length)];
    document.getElementById('quote-widget').innerHTML =
      '\u201c' + pick.text + '\u201d &mdash; ' + pick.speaker;
  })
  .catch(function(){});
</script>
</body>
</html>

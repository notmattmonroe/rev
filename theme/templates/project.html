{% extends "base.html" %}

{% block title %}revmatt — {{ article.title }}{% endblock %}

{% block sidebar %}
<div class="archives">
  <h2>Projects</h2>
  <a href="{{ SITEURL }}/projects/">All projects</a>
</div>
{% endblock %}

{% block content %}
<div class="entry">
  <h2 class="entry-title">{{ article.title }}</h2>
  <p class="entry-info">{{ article.date | strftime("%-d %B %Y") }}</p>
  <div class="blogpost">
    {{ article.content }}
  </div>
</div>
{% endblock %}
